name: Build

# Produces ready to run builds for Windows and macOS: a single .exe and a .dmg.
# Push a tag like v0.1.0 to also get a GitHub Release with both attached.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: VRMirror-windows
          - os: macos-latest
            artifact: VRMirror-macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build the device server
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          chmod +x server/build.sh
          ./server/build.sh || echo "device server not built; screenrecord engine will be used"

      # Windows gets the single file build, macOS gets the .app so it can go
      # into a disk image.
      - name: Build the application (Windows)
        if: runner.os == 'Windows'
        run: python tools/build.py --clean --onefile

      - name: Build the application (macOS)
        if: runner.os == 'macOS'
        run: python tools/build.py --clean

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x tools/make_dmg.sh
          ./tools/make_dmg.sh

      - name: Check the artifact exists
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f dist/VRMirror.exe || { echo "dist/VRMirror.exe missing"; exit 1; }
          else
            test -f dist/VRMirror.dmg || { echo "dist/VRMirror.dmg missing"; exit 1; }
          fi
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/VRMirror.exe
            dist/VRMirror.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
          generate_release_notes: true
