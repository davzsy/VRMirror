name: Build

# Produces ready to run builds for Windows and macOS. Push a tag like v0.1.0 to
# also get a GitHub Release with both attached.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: VRMirror-windows
          - os: macos-latest
            artifact: VRMirror-macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build the device server
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          chmod +x server/build.sh
          ./server/build.sh || echo "device server not built; screenrecord engine will be used"

      - name: Build the application
        run: python tools/build.py --clean

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/VRMirror/* -DestinationPath VRMirror-windows.zip
        shell: pwsh

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -qry ../VRMirror-macos.zip VRMirror.app || zip -qry ../VRMirror-macos.zip VRMirror

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: VRMirror-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
